services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: webschool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - webschool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webschool"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: webschool:current
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      NODE_ENV: production
      POSTGRES_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}@postgres:5432/webschool
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env.vps}
      NEXTAUTH_URL: ${SITE_ORIGIN:?Set SITE_ORIGIN to the public HTTPS origin in .env.vps}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - webschool
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  webschool:
    driver: bridge

volumes:
  postgres_data:
